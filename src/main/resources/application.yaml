spring:
  main:
    web-application-type: reactive

  application:
    name: payment-service

  profiles:
    active: ${SPRING_PROFILE:dev}

  r2dbc:
    url: r2dbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    pool:
      max-size: ${R2DBC_POOL_MAX_SIZE:10}
      initial-size: ${R2DBC_POOL_INITIAL_SIZE:5}
      max-idle-time: ${R2DBC_POOL_MAX_IDLE_TIME:30m}
      validation-query: ${R2DBC_POOL_VALIDATION_QUERY:SELECT 1}

  liquibase:
    url: ${LIQUIBASE_URL:jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}}
    user: ${LIQUIBASE_USER:${POSTGRES_USER}}
    password: ${LIQUIBASE_PASSWORD:${POSTGRES_PASSWORD}}
    change-log: ${SPRING_LIQUIBASE_CHANGELOG:classpath:db/changelog/main-changelog.yaml}
    enabled: true

  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:always}
      platform: ${SPRING_SQL_INIT_PLATFORM:postgresql}

server:
  port: ${MAIN_SERVICE_PORT:8081}

debug: true

springdoc:
  api-docs:
    enabled: ${SPRING_DOC_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${SPRING_DOC_SWAGGER_UI_ENABLED:true}
    doc-expansion: ${SPRING_DOC_SWAGGER_UI_DOC_EXPANSION:none}

logging:
  enabled: ${LOGGING_ENABLED:true}
  metric-enabled: ${LOGGING_METRIC_ENABLED:true}
  request-logging-enabled: ${LOGGING_REQUEST_LOGGING:true}
  level:
    com.logging: ${LOGGING_LEVEL_COM_LOGGING:DEBUG}
    org.springframework.web: ${LOGGING_LEVEL_SPRING_WEB:INFO}
    org.springframework.data.r2dbc: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_DATA_R2DBC:DEBUG}
    io.r2dbc.postgresql.QUERY: ${LOGGING_LEVEL_IO_R2DBC_POSTGRESQL_QUERY:DEBUG}
    org.apache.kafka: ${LOGGING_LEVEL_ORG_APACHE_KAFKA:OFF}
    org.springframework.kafka: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_KAFKA:OFF}
    reactor.kafka: ${LOGGING_LEVEL_REACTOR_KAFKA:OFF}

app:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

    deserializer:
      trusted-packages: "${KAFKA_TRUSTED_PACKAGES:*}"
      use-type-info-headers: ${KAFKA_USE_TYPE_INFO_HEADERS:false}

    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID}
      max-poll-records: ${KAFKA_CONSUMER_MAX_POLL_RECORDS:10}
      session-timeout: ${KAFKA_CONSUMER_SESSION_TIMEOUT:10000}
      heartbeat-interval: ${KAFKA_CONSUMER_HEARTBEAT_INTERVAL:3000}
      max-poll-interval-ms: ${KAFKA_CONSUMER_MAX_POLL_INTERVAL_MS:300000}
      enable-auto-commit: ${KAFKA_CONSUMER_ENABLE_AUTO_COMMIT:false}
      auto-offset-reset: ${KAFKA_CONSUMER_AUTO_OFFSET_RESET:earliest}

    producer:
      enable: ${KAFKA_PRODUCER_ENABLE:true}
      retries: ${KAFKA_PRODUCER_RETRIES:3}
      retry-backoff-ms: ${KAFKA_PRODUCER_RETRY_BACKOFF_MS:1000}
      idempotence: ${KAFKA_PRODUCER_IDEMPOTENCE:false}

    listener:
      batch-listener: ${KAFKA_BATCH_LISTENER:false}
      poll-timeout: ${KAFKA_LISTENER_POLL_TIMEOUT:5000}
      concurrency: ${KAFKA_CONCURRENCY:1}
      micrometer-enabled: ${KAFKA_MICROMETER_ENABLED:true}

      payment:
        topic: ${KAFKA_LISTENER_PAYMENT_TOPIC:${KAFKA_TOPIC_ORDER_PROCESSING_PAYMENT}}
        group-id: ${KAFKA_LISTENER_PAYMENT_GROUP_ID:${KAFKA_CONSUMER_GROUP_ID}}
        batch-mode: ${KAFKA_LISTENER_PAYMENT_BATCH_MODE:false}
        concurrency: ${KAFKA_LISTENER_PAYMENT_CONCURRENCY:1}
        container-factory: ${KAFKA_LISTENER_PAYMENT_CONTAINER_FACTORY:orderProcessingPaymentKafkaListenerContainerFactory}
        retry:
          attempts: ${PAYMENT_RETRY_ATTEMPTS:4}
          delay-ms: ${PAYMENT_RETRY_DELAY_MS:2000}
          multiplier: ${PAYMENT_RETRY_MULTIPLIER:2.0}
          max-delay-ms: ${PAYMENT_RETRY_MAX_DELAY_MS:16000}
          num-partitions: ${PAYMENT_RETRY_NUM_PARTITIONS:3}
          auto-create-topics: ${PAYMENT_RETRY_AUTO_CREATE_TOPICS:true}

      order-compensated:
        topic: ${KAFKA_LISTENER_ORDER_COMPENSATED_TOPIC:${KAFKA_TOPIC_ORDER_COMPENSATED}}
        group-id: ${KAFKA_LISTENER_ORDER_COMPENSATED_GROUP_ID:${KAFKA_CONSUMER_GROUP_ID}}
        batch-mode: ${KAFKA_LISTENER_ORDER_COMPENSATED_BATCH_MODE:false}
        concurrency: ${KAFKA_LISTENER_ORDER_COMPENSATED_CONCURRENCY:1}
        container-factory: ${KAFKA_LISTENER_ORDER_COMPENSATED_CONTAINER_FACTORY:orderCompensatedKafkaListenerContainerFactory}

    error:
      retry:
        backoff-ms: ${KAFKA_ERROR_BACKOFF_MS:1000}
        max-attempts: ${KAFKA_ERROR_MAX_ATTEMPTS:3}

    topics:
      order-processing-payment: ${KAFKA_TOPIC_ORDER_PROCESSING_PAYMENT}
      order-compensated: ${KAFKA_TOPIC_ORDER_COMPENSATED}
      payment-succeeded: ${KAFKA_TOPIC_PAYMENT_SUCCEEDED}
      payment-failed: ${KAFKA_TOPIC_PAYMENT_FAILED}

  outbox:
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:1000}

  payment:
    mock-success-probability: ${PAYMENT_MOCK_SUCCESS_PROBABILITY:0.9}
    failure-simulator:
      enabled: ${PAYMENT_FAILURE_SIMULATOR_ENABLED:false}
      transient-probability: ${PAYMENT_FAILURE_TRANSIENT_PROBABILITY:0.5}
      poison-amount-threshold: ${PAYMENT_FAILURE_POISON_AMOUNT_THRESHOLD:1000000}
