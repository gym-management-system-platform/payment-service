#App
MAIN_SERVICE_PORT: 8083
SPRING_PROFILE: dev

#PostgreSQL
POSTGRES_HOST: localhost
POSTGRES_PORT: 6436
POSTGRES_DB: payment_service_db
POSTGRES_USER: payment_service_user
POSTGRES_PASSWORD: payment_service_password

R2DBC_POOL_MAX_SIZE: 10
R2DBC_POOL_INITIAL_SIZE: 5
R2DBC_POOL_MAX_IDLE_TIME: 30m
R2DBC_POOL_VALIDATION_QUERY: SELECT 1

SPRING_SQL_INIT_MODE: always
SPRING_SQL_INIT_PLATFORM: postgresql

SPRING_LIQUIBASE_CHANGELOG: classpath:db/changelog/main-changelog.yaml
LIQUIBASE_URL: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
LIQUIBASE_USER: ${POSTGRES_USER}
LIQUIBASE_PASSWORD: ${POSTGRES_PASSWORD}

# Swagger / OpenAPI
SPRING_DOC_API_DOCS_ENABLED: true
SPRING_DOC_SWAGGER_UI_ENABLED: true
SPRING_DOC_SWAGGER_UI_DOC_EXPANSION: none

# Logging
LOGGING_ENABLED: true
LOGGING_METRIC_ENABLED: true
LOGGING_REQUEST_LOGGING: true

LOGGING_LEVEL_COM_LOGGING: DEBUG
LOGGING_LEVEL_SPRING_WEB: INFO

LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_DATA_R2DBC: DEBUG
LOGGING_LEVEL_IO_R2DBC_POSTGRESQL_QUERY: DEBUG

#Kafka
# Kafka Bootstrap Servers (можно указать несколько через запятую)
KAFKA_BOOTSTRAP_SERVERS: localhost:9391,localhost:9392,localhost:9393

# Kafka Consumer Settings
KAFKA_CONSUMER_GROUP_ID: account-processing-group
KAFKA_CONSUMER_MAX_POLL_RECORDS: 10
KAFKA_CONSUMER_SESSION_TIMEOUT: 10000
KAFKA_CONSUMER_HEARTBEAT_INTERVAL: 3000
KAFKA_CONSUMER_MAX_POLL_INTERVAL_MS: 300000

# Kafka Producer Settings
KAFKA_PRODUCER_ENABLE: true

# Kafka Listener Settings
KAFKA_LISTENER_POLL_TIMEOUT: 1000

# Kafka Topics
KAFKA_TOPIC_CLIENT_PRODUCTS: client_products # УБРАТЬ
