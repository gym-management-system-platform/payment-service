plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.payment'
version = '0.0.1-SNAPSHOT'
description = 'Cервис для управления платежами'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenLocal()
    mavenCentral()
}

ext {
    loggingVersion = '1.0.0'
    mapstructVersion = '1.6.3'
    openapiVersion = '2.6.0'
}

dependencies {
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // Mapper
    implementation "org.mapstruct:mapstruct:${mapstructVersion}"
    annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"

    // Documentation
    implementation "org.springdoc:springdoc-openapi-starter-webflux-ui:${openapiVersion}"

    // Database
    implementation('org.liquibase:liquibase-core') {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-web'
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-jdbc'
        exclude group: 'org.springframework', module: 'spring-web'
        exclude group: 'org.springframework', module: 'spring-webmvc'
        exclude group: 'org.apache.tomcat', module: 'tomcat-jdbc'
    }

    runtimeOnly 'org.postgresql:postgresql'

    // R2DBC для реактивного доступа
    implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
    implementation 'org.postgresql:r2dbc-postgresql'

    // Kafka - исключаем web
    implementation('org.springframework.kafka:spring-kafka') {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-web'
    }
    implementation 'io.projectreactor.kafka:reactor-kafka'

    // Jackson
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // Logging - исключаем web
    implementation("mydev.logging:logging-spring-boot-starter:${loggingVersion}") {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-web'
    }
}

tasks.named('test') {
    useJUnitPlatform()
}